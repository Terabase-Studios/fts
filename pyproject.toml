[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fts"
version = "0.1.0"
description = "Peer to peer file and directory tranfer system"
authors = [
  { name = "Terabase Studios", email = "terabasestudios@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "cryptography>=41.0",
]

[project.scripts]
fts = "fts.cli:main"

