[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fts"
version = "0.3.0"
description = "Peer to peer file and directory tranfer system"
authors = [
  { name = "Terabase Studios", email = "terabasestudios@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "cryptography>=41.0",
    "argcomplete>=3.1.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "sympy>=1.12",  # add the version you want
]

[project.scripts]
fts = "fts.cli:main"

# add sympy